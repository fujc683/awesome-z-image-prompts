name: Update README
on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch stats
        run: |
          python3 - <<'EOS'
          import re,pathlib,datetime
          p=pathlib.Path('README.md'); t=p.read_text(encoding='utf-8')
          t=re.sub(r'- Last updated: .*', f'- Last updated: {datetime.date.today().isoformat()}', t)
          p.write_text(t,encoding='utf-8')
          EOS
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --staged --quiet || git commit -m "docs: auto-update README [skip ci]"
          for i in 1 2 3; do git push && break || (git pull --rebase origin main && sleep $((i*2))); done
